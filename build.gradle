import net.ltgt.gradle.errorprone.CheckSeverity

plugins{
    id "net.ltgt.errorprone" version "5.1.0" apply false
    id "com.vanniktech.maven.publish" version "0.37.0" apply false
    id("com.diffplug.spotless") version "8.10.0" apply false
}

allprojects {
    group = GROUP
    version = VERSION_NAME
    tasks.withType(Test) {
        maxParallelForks = Runtime.getRuntime().availableProcessors()
        systemProperties = [
                'junit.jupiter.execution.parallel.enabled': 'true',
                'junit.jupiter.execution.parallel.mode.default': 'concurrent'
        ]
        // Tests that drive javac through Error Prone need access to its internals, which
        // are encapsulated since JDK 16.
        jvmArgs += [
                "--add-exports=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED",
                "--add-exports=jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED",
                "--add-exports=jdk.compiler/com.sun.tools.javac.main=ALL-UNNAMED",
                "--add-exports=jdk.compiler/com.sun.tools.javac.model=ALL-UNNAMED",
                "--add-exports=jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED",
                "--add-exports=jdk.compiler/com.sun.tools.javac.processing=ALL-UNNAMED",
                "--add-exports=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED",
                "--add-exports=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED",
                "--add-opens=jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED",
                "--add-opens=jdk.compiler/com.sun.tools.javac.comp=ALL-UNNAMED"
        ]
    }
}

apply from: "gradle/dependencies.gradle"

subprojects { proj ->

    proj.apply plugin: "java"
    proj.apply plugin: "net.ltgt.errorprone"
    proj.apply plugin: "com.diffplug.spotless"

    proj.dependencies {
        errorprone deps.build.errorProneCore
        if(proj.name != "ban-mutable-static"){
            annotationProcessor project(":checks:ban-mutable-static")
        }
        testImplementation deps.test.junitapi
        testRuntimeOnly deps.test.junitengine
    }

    proj.tasks.withType(JavaCompile) {
        options.compilerArgs += [
                "--add-exports=jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED",
                "--add-exports=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED",
                "--add-exports=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED"
        ]
        if (!name.toLowerCase().contains("test")) {
            options.errorprone {
                check("StringSplitter", CheckSeverity.OFF)
                check("WildcardImport", CheckSeverity.ERROR)
                check("MissingBraces", CheckSeverity.ERROR)
                if (project.name != "ban-mutable-static") {
                    check("BanMutableStatic", CheckSeverity.ERROR)
                }
            }
        }
        options.fork = true
    }

    proj.tasks.withType(Javadoc) {
        options.addMultilineStringsOption("-add-exports").setValue([
                "jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED",
                "jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED",
                "jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED"
        ])
    }

    repositories {
        mavenLocal()
        mavenCentral()
        google()
    }

    java {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    spotless {
        java {
            googleJavaFormat('1.28.0')
        }
    }
}
